[package]
name = "pinot-query-server-rust"
version = "0.1.0"
edition = "2021"
authors = ["Apache Pinot Contributors"]
description = "High-performance Rust implementation of Pinot Query Server with scatter-gather and memory backpressure"
license = "Apache-2.0"

[lib]
name = "pinot_query_server"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full", "sync", "rt-multi-thread", "time", "macros"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"

# gRPC
tonic = { version = "0.10", features = ["tls", "gzip"] }
prost = "0.12"
prost-types = "0.12"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
bytes = "1.5"

# Concurrency
crossbeam = "0.8"
crossbeam-channel = "0.5"
parking_lot = "0.12"
dashmap = "5.5"
arc-swap = "1.6"

# Memory management
memory-stats = "1.1"

# Utilities
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
lazy_static = "1.4"
uuid = { version = "1.6", features = ["v4"] }
rand = "0.8"
siphasher = "1.0"
crc32fast = "1.3"

# JNI
jni = "0.21"

# Metrics
prometheus = "0.13"

# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.5"

[build-dependencies]
tonic-build = "0.10"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.8"
proptest = "1.4"

[[bench]]
name = "scatter_gather"
harness = false

[[bench]]
name = "backpressure"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.bench]
opt-level = 3
debug = true
