[package]
name = "pinot-broker-rust"
version = "0.1.0"
edition = "2021"
authors = ["Apache Pinot Contributors"]
description = "High-performance Rust implementation of Apache Pinot Broker components"
license = "Apache-2.0"

[lib]
name = "pinot_broker"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full", "sync", "time", "rt-multi-thread"] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
thrift = "0.17"

# Networking
hyper = { version = "1.1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
tokio-rustls = "0.25"
rustls = "0.22"

# Concurrency
parking_lot = "0.12"
crossbeam-channel = "0.5"
crossbeam-utils = "0.8"
dashmap = "5.5"
arc-swap = "1.6"
rayon = "1.10"

# Hashing and collections
ahash = "0.8"
hashbrown = { version = "0.14", features = ["serde"] }
indexmap = { version = "2.1", features = ["serde"] }

# Memory management
bytes = "1.5"
tikv-jemallocator = { version = "0.5", features = ["stats"] }

# Utilities
rand = "0.8"
uuid = { version = "1.6", features = ["v4", "fast-rng"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
thiserror = "1.0"
anyhow = "1.0"
once_cell = "1.19"
smallvec = { version = "1.11", features = ["serde"] }
num_cpus = "1.16"

# Metrics
prometheus = "0.13"

# JNI
jni = "0.21"

# Compression
lz4 = "1.24"
zstd = "0.13"
snap = "1.1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
tokio-test = "0.4"
proptest = "1.4"
test-case = "3.3"
mockall = "0.12"

[[bench]]
name = "routing"
harness = false

[[bench]]
name = "reduce"
harness = false

[[bench]]
name = "scatter_gather"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
opt-level = 3
lto = "thin"
